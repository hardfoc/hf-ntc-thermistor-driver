<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">NtcThermistor&lt;AdcType&gt;, inc/ntc_thermistor.hpp</text>
<text x="56" y="510.4" font-size="20" font-weight="700" fill="#3730A3">ADC interface</text>
<text x="56" y="541" font-size="17" fill="#2B3442">ntc::AdcInterface&lt;Derived&gt;: CRTP base, calls resolved at compile time;</text>
<text x="56" y="565.7" font-size="17" fill="#2B3442">volts to ohms (divider), ohms to degrees (Beta or lookup table) in the core above it</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="693.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">IsInitialized()  EnsureInitialized()  IsChannelAvailable()  ReadChannelCount()</text>
<text x="56" y="716.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">ReadChannelV()  GetReferenceVoltage()  GetResolutionBits()</text>
<text x="56" y="815.4" font-size="20" font-weight="700" fill="#17202C">ADC input and divider</text>
<text x="56" y="846" font-size="17" fill="#2B3442">supply  /  series resistor  /  ADC node  /  NTC thermistor  /  ground</text>
