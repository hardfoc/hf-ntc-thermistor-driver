<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="t d">
  <title id="t">NTC voltage divider</title>
  <desc id="d">The divider supply V_REF feeds the series resistor R_SERIES to the ADC node; the NTC thermistor runs from the node to ground; an optional capacitor from the node to ground filters noise. The ADC input reads V_NODE.</desc>
  <style>
    .w { stroke: #17202c; stroke-width: 2; fill: none; }
    .r { stroke: #17202c; stroke-width: 2; fill: #ffffff; }
    .o { stroke: #17202c; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .t { font-family: Inter, system-ui, sans-serif; font-size: 16px; fill: #17202c; }
    .s { font-family: Inter, system-ui, sans-serif; font-size: 14px; fill: #3d4756; }
    .m { font-family: "JetBrains Mono", Consolas, monospace; font-size: 15px; fill: #17202c; }
    .n { fill: #17202c; }
    .a { stroke: #3b38c4; stroke-width: 2.5; fill: none; }
    .ah { fill: #3b38c4; }
  </style>
  <rect width="560" height="340" fill="#ffffff"/>
  <line class="w" x1="120" y1="30" x2="200" y2="30"/>
  <text class="m" x="60" y="35">V_REF</text>
  <line class="w" x1="160" y1="30" x2="160" y2="60"/>
  <rect class="r" x="145" y="60" width="30" height="70"/>
  <text class="m" x="190" y="92">R_SERIES</text>
  <text class="s" x="190" y="112">10 kΩ, 1 % or better</text>
  <line class="w" x1="160" y1="130" x2="160" y2="170"/>
  <circle class="n" cx="160" cy="170" r="5"/>
  <line class="w" x1="160" y1="170" x2="330" y2="170"/>
  <circle class="n" cx="330" cy="170" r="5"/>
  <line class="a" x1="330" y1="170" x2="420" y2="170"/>
  <polygon class="ah" points="430,170 416,162 416,178"/>
  <text class="t" x="440" y="165">ADC input</text>
  <text class="m" x="440" y="188">V_NODE</text>
  <line class="w" x1="160" y1="170" x2="160" y2="200"/>
  <rect class="r" x="145" y="200" width="30" height="70"/>
  <line class="w" x1="132" y1="262" x2="188" y2="208"/>
  <line class="w" x1="132" y1="262" x2="120" y2="262"/>
  <text class="m" x="196" y="232">NTC</text>
  <text class="s" x="196" y="252">10 kΩ at 25 °C</text>
  <line class="w" x1="160" y1="270" x2="160" y2="300"/>
  <line class="o" x1="330" y1="170" x2="330" y2="222"/>
  <line class="w" x1="310" y1="222" x2="350" y2="222"/>
  <line class="w" x1="310" y1="232" x2="350" y2="232"/>
  <line class="o" x1="330" y1="232" x2="330" y2="300"/>
  <text class="s" x="358" y="232">C_FILT (optional)</text>
  <line class="w" x1="120" y1="300" x2="370" y2="300"/>
  <line class="w" x1="225" y1="310" x2="265" y2="310"/>
  <line class="w" x1="235" y1="320" x2="255" y2="320"/>
  <line class="w" x1="245" y1="300" x2="245" y2="310"/>
  <text class="m" x="60" y="305">GND</text>
</svg>
